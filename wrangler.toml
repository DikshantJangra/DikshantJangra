name = "dikshantjangra"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# Worker + static assets. `npm run build` compiles functions/ (Pages-style routes) into .worker/index.js;
# static files in dist are served first, everything else (/api, /mcp, /auth) falls through to the Worker.
main = ".worker/index.js"
routes = [
  { pattern = "dikshantjangra.me", custom_domain = true },
  { pattern = "www.dikshantjangra.me", custom_domain = true },
]

[assets]
directory = "dist"
binding = "ASSETS"

# Uncomment each block once the resource exists (see DEPLOY.md). Functions run without them.
# [[kv_namespaces]]
# binding = "STATUS"
# id = "" # wrangler kv namespace create STATUS

# [[d1_databases]]
# binding = "DB"
# database_name = "guestbook"
# database_id = "" # wrangler d1 create guestbook
# migrations_dir = "migrations"

# Deploy workers/presence first; Pages binds to its Durable Object.
# [[durable_objects.bindings]]
# name = "PRESENCE"
# class_name = "Presence"
# script_name = "dikshantjangra-presence"

[ai]
binding = "AI"
