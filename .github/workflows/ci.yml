name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx -p typescript@5 tsc --noEmit -p . && npx -p typescript@5 tsc --noEmit -p functions
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright, path: "tests/*-snapshots/\ntest-results/", if-no-files-found: ignore }
      - run: npx @lhci/cli@0.15 autorun
